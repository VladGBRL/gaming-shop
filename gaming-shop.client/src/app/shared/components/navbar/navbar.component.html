<nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
  <div class="container">

    <!-- Logo -->
    <a class="navbar-brand fw-bold" [routerLink]="['/home']">GameStore</a>

    <!-- Toggle (Mobile) -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Main Links -->
    <div class="collapse navbar-collapse" id="navbarNav">
     

      <!-- Right side -->
      <ul class="navbar-nav ms-auto">

        <!-- Logged in links -->
        <ng-container *ngIf="auth.currentUser()">
          <li class="nav-item mx-2">
            <a class="nav-link" [routerLink]="['/products']" (click)="$event.preventDefault();">Shop Now</a>
          </li>

          <li class="nav-item mx-2" *ngIf="isAdmin()">
            <a class="nav-link" [routerLink]="['/admin-dashboard']" (click)="$event.preventDefault();">Admin Dashboard</a>
          </li>

          <li class="nav-item mx-2">
            <a class="nav-link" [routerLink]="['/wishlist']" (click)="$event.preventDefault();">Wishlist</a>
          </li>

          <li class="nav-item mx-2">
            <a class="nav-link" [routerLink]="['/cart']" (click)="$event.preventDefault();">Cart</a>
          </li>
          <li class="nav-item mx-2">
            <a class="nav-link" [routerLink]="['/history']" (click)="$event.preventDefault();">History</a>
          </li>

          <!-- User dropdown -->
          <li class="nav-item dropdown mx-2 user-section">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
              {{ auth.currentUser()?.username }}
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li>
                <a class="dropdown-item" href="#" (click)="logout($event)">Logout</a>
              </li>
            </ul>
          </li>
        </ng-container>

        <!-- Not logged in -->
        <ng-container *ngIf="!auth.currentUser()">
          <li class="nav-item dropdown mx-2">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
              Account
            </a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="/login">Login</a></li>
              <li><a class="dropdown-item" href="/register">Register</a></li>
            </ul>
          </li>
        </ng-container>

      </ul>
    </div>
  </div>
</nav>
