<app-navbar></app-navbar>
<div class="auth-container">
  <div class="auth-card p-4">
    <h2 class="text-center mb-4">Sign In</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="mb-3">
        <input type="email" class="form-control" placeholder="Email" formControlName="email" />
      </div>

      <div class="mb-3 position-relative">
        <input [type]="showPassword ? 'text' : 'password'" class="form-control" placeholder="Password" formControlName="password" />
        <i class="toggle-icon" (click)="togglePasswordVisibility()">
          {{ showPassword ? '🙈' : '👁️' }}
        </i>
      </div>

      <div class="d-flex align-items-center mb-3">
        <input type="checkbox" formControlName="rememberMe" class="form-check-input me-2" />
        <label>Remember me</label>
      </div>

      <button class="btn btn-dark w-100 mt-2" [disabled]="loginForm.invalid">Login</button>

      <p class="text-danger text-center mt-2" *ngIf="errorMessage">{{ errorMessage }}</p>

      <p class="mt-3 text-center">
        Don’t have an account?
        <a routerLink="/register" class="text-light">Register</a>
      </p>
    </form>
  </div>
</div>
