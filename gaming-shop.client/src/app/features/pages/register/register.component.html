<app-navbar></app-navbar>
<div class="auth-container">
  <div class="auth-card p-4">
    <h2 class="text-center mb-4">Create Account</h2>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

      <div class="d-flex gap-2 mb-3">
        <input type="text" class="form-control" placeholder="First Name" formControlName="firstName" />
        <input type="text" class="form-control" placeholder="Last Name" formControlName="lastName" />
      </div>

      <div class="mb-3">
        <input type="email" class="form-control" placeholder="Email" formControlName="email" />
      </div>

      <div class="mb-3">
        <input type="text" class="form-control" placeholder="Phone Number" formControlName="phoneNumber" />
      </div>

      <div class="mb-3 position-relative">
        <input [type]="showPassword ? 'text' : 'password'" class="form-control" placeholder="Password" formControlName="password" />
        <i class="toggle-icon" (click)="togglePasswordVisibility()">
          {{ showPassword ? '🙈' : '👁️' }}
        </i>
      </div>

      <div class="mb-3 position-relative">
        <input [type]="showConfirmPassword ? 'text' : 'password'" class="form-control" placeholder="Confirm Password" formControlName="confirmPassword" />
        <i class="toggle-icon" (click)="toggleConfirmPasswordVisibility()">
          {{ showConfirmPassword ? '🙈' : '👁️' }}
        </i>
        <small class="text-danger mt-1 d-block" *ngIf="registerForm.errors?.['mismatch'] && registerForm.touched">
          Passwords do not match
        </small>
      </div>

      <button class="btn btn-dark w-100 mt-3" [disabled]="registerForm.invalid">Register</button>

      <p class="text-danger text-center mt-2" *ngIf="errorMessage">{{ errorMessage }}</p>

      <p class="mt-3 text-center">
        Already have an account?
        <a routerLink="/login" class="text-light">Sign In</a>
      </p>
    </form>
  </div>
</div>
